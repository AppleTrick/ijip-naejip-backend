<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 API 관리자 페이지</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .api-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .api-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            max-height: 500px;
            overflow-y: auto;
        }

        .result-box pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #333;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
        }

        .success {
            color: #27ae60;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .cascade-selects > div {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 부동산 API 테스트 관리자 페이지</h1>

        <!-- 지역코드 API 섹션 -->
        <div class="api-section">
            <h2>📍 지역코드 API</h2>

            <div class="form-group">
                <label for="sidoSelect">1단계: 시도 선택 (페이지 로딩 시 자동으로 불러옴)</label>
                <select id="sidoSelect">
                    <option value="">시도 목록을 불러오는 중...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gugunSelect">2단계: 구군 선택 (시도 선택 시 자동으로 불러옴)</label>
                <select id="gugunSelect">
                    <option value="">시도를 먼저 선택하세요</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dongSelect">3단계: 동 선택 (구군 선택 시 자동으로 불러오고 조회됨)</label>
                <select id="dongSelect">
                    <option value="">구군을 먼저 선택하세요</option>
                </select>
            </div>

            <div class="result-box" id="dongcodeResult">
                <pre>결과가 여기에 표시됩니다.</pre>
            </div>
        </div>

        <!-- 부동산 거래 API 섹션 -->
        <div class="grid-2">
            <div class="api-section">
                <h2>🏘️ 동코드로 최근 거래 조회</h2>

                <div class="form-group">
                    <label for="dongCodeInput">동코드</label>
                    <input type="text" id="dongCodeInput" placeholder="예: 1168010100">
                </div>

                <div class="form-group">
                    <label for="limitInput">조회 개수</label>
                    <input type="number" id="limitInput" value="10" min="1" max="100">
                </div>

                <button class="btn" onclick="searchByDongCode()">조회</button>

                <div class="result-box" id="dongCodeDealResult">
                    <pre>결과가 여기에 표시됩니다.</pre>
                </div>
            </div>

            <div class="api-section">
                <h2>🏢 아파트별 거래 내역 조회</h2>

                <div class="form-group">
                    <label for="aptSeqInput">아파트 시퀀스 (apt_seq)</label>
                    <input type="text" id="aptSeqInput" placeholder="예: 11680-1">
                </div>

                <button class="btn" onclick="searchByAptSeq()">조회</button>

                <div class="result-box" id="aptSeqResult">
                    <pre>결과가 여기에 표시됩니다.</pre>
                </div>
            </div>
        </div>

        <div class="api-section">
            <h2>📄 거래 번호로 상세 조회</h2>

            <div class="form-group">
                <label for="dealNoInput">거래 번호 (no)</label>
                <input type="number" id="dealNoInput" placeholder="예: 1">
            </div>

            <button class="btn" onclick="searchByDealNo()">조회</button>

            <div class="result-box" id="dealNoResult">
                <pre>결과가 여기에 표시됩니다.</pre>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        // 결과 표시 헬퍼 함수
        function displayResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            if (isError) {
                element.innerHTML = `<pre class="error">${data}</pre>`;
            } else {
                element.innerHTML = `<pre class="success">${JSON.stringify(data, null, 2)}</pre>`;
            }
        }

        function displayLoading(elementId) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<pre class="loading">로딩 중...</pre>`;
        }

        // 시도 목록 불러오기
        async function loadSidoList() {
            displayLoading('dongcodeResult');
            try {
                const response = await fetch(`${API_BASE}/dongcode/sido`);
                const data = await response.json();

                const sidoSelect = document.getElementById('sidoSelect');
                sidoSelect.innerHTML = '<option value="">시도를 선택하세요</option>';

                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.sidoName;
                    option.textContent = item.sidoName;
                    sidoSelect.appendChild(option);
                });

                displayResult('dongcodeResult', data);
            } catch (error) {
                displayResult('dongcodeResult', `에러 발생: ${error.message}`, true);
            }
        }

        // 구군 목록 불러오기
        async function loadGugunList() {
            const sidoName = document.getElementById('sidoSelect').value;
            if (!sidoName) {
                return;
            }

            displayLoading('dongcodeResult');

            // 구군, 동 선택 초기화
            const gugunSelect = document.getElementById('gugunSelect');
            const dongSelect = document.getElementById('dongSelect');
            gugunSelect.innerHTML = '<option value="">구군을 선택하세요</option>';
            dongSelect.innerHTML = '<option value="">구군을 먼저 선택하세요</option>';
            document.getElementById('dongCodeInput').value = '';

            try {
                const response = await fetch(`${API_BASE}/dongcode/gugun?sido=${encodeURIComponent(sidoName)}`);
                const data = await response.json();

                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.gugunName;
                    option.textContent = item.gugunName;
                    gugunSelect.appendChild(option);
                });

                displayResult('dongcodeResult', data);
            } catch (error) {
                displayResult('dongcodeResult', `에러 발생: ${error.message}`, true);
            }
        }

        // 동 목록 불러오기
        async function loadDongList() {
            const sidoName = document.getElementById('sidoSelect').value;
            const gugunName = document.getElementById('gugunSelect').value;

            if (!sidoName || !gugunName) {
                return;
            }

            displayLoading('dongcodeResult');

            // 동 선택 초기화
            const dongSelect = document.getElementById('dongSelect');
            dongSelect.innerHTML = '<option value="">동을 선택하세요</option>';
            document.getElementById('dongCodeInput').value = '';

            try {
                const response = await fetch(`${API_BASE}/dongcode/dong?sido=${encodeURIComponent(sidoName)}&gugun=${encodeURIComponent(gugunName)}`);
                const data = await response.json();

                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.dongCode;
                    option.textContent = `${item.dongName} (${item.dongCode})`;
                    dongSelect.appendChild(option);
                });

                displayResult('dongcodeResult', data);
            } catch (error) {
                displayResult('dongcodeResult', `에러 발생: ${error.message}`, true);
            }
        }

        // 동코드로 최근 거래 조회
        async function searchByDongCode() {
            const dongCode = document.getElementById('dongCodeInput').value;
            const limit = document.getElementById('limitInput').value;

            if (!dongCode) {
                alert('동코드를 입력하세요!');
                return;
            }

            displayLoading('dongCodeResult');
            try {
                const response = await fetch(`${API_BASE}/house/deals/dong/${dongCode}?limit=${limit}`);
                const data = await response.json();
                displayResult('dongCodeResult', data);
            } catch (error) {
                displayResult('dongCodeResult', `에러 발생: ${error.message}`, true);
            }
        }

        // 아파트별 거래 내역 조회
        async function searchByAptSeq() {
            const aptSeq = document.getElementById('aptSeqInput').value;

            if (!aptSeq) {
                alert('아파트 시퀀스를 입력하세요!');
                return;
            }

            displayLoading('aptSeqResult');
            try {
                const response = await fetch(`${API_BASE}/house/deals/apt/${encodeURIComponent(aptSeq)}`);
                const data = await response.json();
                displayResult('aptSeqResult', data);
            } catch (error) {
                displayResult('aptSeqResult', `에러 발생: ${error.message}`, true);
            }
        }

        // 거래 번호로 상세 조회
        async function searchByDealNo() {
            const dealNo = document.getElementById('dealNoInput').value;

            if (!dealNo) {
                alert('거래 번호를 입력하세요!');
                return;
            }

            displayLoading('dealNoResult');
            try {
                const response = await fetch(`${API_BASE}/house/deals/${dealNo}`);
                const data = await response.json();
                displayResult('dealNoResult', data);
            } catch (error) {
                displayResult('dealNoResult', `에러 발생: ${error.message}`, true);
            }
        }

        // 이벤트 리스너 설정
        document.getElementById('sidoSelect').addEventListener('change', function() {
            loadGugunList();
        });

        document.getElementById('gugunSelect').addEventListener('change', function() {
            loadDongList();
        });

        // 동 선택시 자동으로 dongCodeInput에 입력하고 조회
        document.getElementById('dongSelect').addEventListener('change', function() {
            const dongCode = this.value;
            document.getElementById('dongCodeInput').value = dongCode;
            if (dongCode) {
                searchByDongCode();
            }
        });

        // 페이지 로딩 시 자동으로 시도 목록 불러오기
        window.addEventListener('DOMContentLoaded', function() {
            loadSidoList();
        });
    </script>
</body>
</html>
